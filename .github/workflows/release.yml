name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Select or create release tag
        id: release-tag
        run: |
          existing_tag="$(git tag --points-at "${GITHUB_SHA}" 'v*' | sort -V | tail -n1)"
          if [ -n "${existing_tag}" ]; then
            tag="${existing_tag}"
          else
            latest_tag="$(git tag --list 'v*' --sort=-version:refname | head -n1)"
            if [ -z "${latest_tag}" ]; then
              latest_tag="v0.0.0"
            fi
            version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "${version}"
            tag="v${major}.${minor}.$((patch + 1))"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "${tag}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package release archive
        env:
          VERSION: ${{ steps.release-tag.outputs.version }}
        run: |
          python scripts/package.py
          mv "artifacts/Sider-ChatGPT-可加载包.zip" "artifacts/sider-chatgpt-${VERSION}.zip"
          (cd artifacts && sha256sum "sider-chatgpt-${VERSION}.zip") > artifacts/SHA256SUMS.txt
          rm "artifacts/Sider-ChatGPT-源码.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-tag.outputs.tag }}
          VERSION: ${{ steps.release-tag.outputs.version }}
        run: |
          gh release create "${TAG}" \
            "artifacts/sider-chatgpt-${VERSION}.zip" \
            artifacts/SHA256SUMS.txt \
            --title "Sider ChatGPT ${VERSION}" \
            --generate-notes
