name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Validate build output
        run: npm run check

      - name: Package release archive
        run: |
          python scripts/package.py
          version="${GITHUB_REF_NAME#v}"
          mv "artifacts/Sider-ChatGPT-可加载包.zip" "artifacts/sider-chatgpt-${version}.zip"
          sha256sum "artifacts/sider-chatgpt-${version}.zip" > artifacts/SHA256SUMS.txt
          rm "artifacts/Sider-ChatGPT-源码.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "artifacts/sider-chatgpt-${version}.zip" \
            artifacts/SHA256SUMS.txt \
            --title "Sider ChatGPT ${version}" \
            --generate-notes
