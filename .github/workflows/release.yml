name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Select or create release tag
        id: release-tag
        run: |
          existing_tag="$(git tag --points-at "${GITHUB_SHA}" 'v*' | sort -V | tail -n1)"
          if [ -n "${existing_tag}" ]; then
            tag="${existing_tag}"
          else
            latest_tag="$(git tag --list 'v*' --sort=-version:refname | head -n1)"
            if [ -z "${latest_tag}" ]; then
              latest_tag="v0.0.0"
            fi
            version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "${version}"
            tag="v${major}.${minor}.$((patch + 1))"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "${tag}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package release archive
        env:
          VERSION: ${{ steps.release-tag.outputs.version }}
        run: |
          python scripts/package.py
          mv "artifacts/Sider-ChatGPT-可加载包.zip" "artifacts/sider-chatgpt-${VERSION}.zip"
          (cd artifacts && sha256sum "sider-chatgpt-${VERSION}.zip") > artifacts/SHA256SUMS.txt
          rm "artifacts/Sider-ChatGPT-源码.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-tag.outputs.tag }}
          VERSION: ${{ steps.release-tag.outputs.version }}
        run: |
          cat > "${RUNNER_TEMP}/release-notes.md" <<'RELEASE_NOTES'
          Sider ChatGPT 为 Edge 提供划词浮窗与 ChatGPT 侧栏，支持解释、翻译、总结、问答、搜索、脑图及持续追问。
          
          ## 下载与安装
          
          下载下方 **ZIP 安装包**。GitHub 自动生成的 Source code 压缩包仅包含源码，不能直接加载。
          
          1. 解压 ZIP，找到包含 `manifest.json` 的 `Sider-ChatGPT` 文件夹。
          2. 打开 `edge://extensions/`，启用开发人员模式，选择“加载解压缩的扩展”，加载该文件夹。
          3. 在普通标签页登录 ChatGPT，并刷新要使用划词功能的网页。
          
          无需安装 Node.js、Python 或配置 API Key。需要用户自己的 ChatGPT 登录状态；可用模型、额度及服务由 ChatGPT 决定。
          
          ## 数据与隐私
          
          执行任务会向 ChatGPT 提交问题、选区及相关网页背景；部分功能使用提取后的整篇网页正文。关闭浮窗不等于删除 ChatGPT 服务端的数据。
          
          - [隐私政策](https://firefly1007.github.io/sider-chatgpt/privacy/)
          - [安装说明与权限用途](https://github.com/Firefly1007/sider-chatgpt#readme)
          - [问题反馈](https://github.com/Firefly1007/sider-chatgpt/issues)
          RELEASE_NOTES
          gh release create "${TAG}" \
            "artifacts/sider-chatgpt-${VERSION}.zip" \
            artifacts/SHA256SUMS.txt \
            --title "Sider ChatGPT ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
